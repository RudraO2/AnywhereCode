<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Game</title>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(135deg, #6e8efb, #a777e3);
      font-family: 'Arial', sans-serif;
    }
    canvas {
      border: 2px solid #fff;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      background: #282c34;
    }
    .game-over {
      position: absolute;
      color: white;
      font-size: 2rem;
      text-align: center;
      display: none;
    }
    .score {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      font-size: 1.2rem;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="score">Score: 0</div>
  <div class="game-over">Game Over!<br><small>Press Enter to Restart</small></div>
  <canvas id="gameCanvas" width="400" height="400"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreDisplay = document.querySelector('.score');
    const gameOverDisplay = document.querySelector('.game-over');

    const gridSize = 20;
    const tileCount = canvas.width / gridSize;

    let snake = [{ x: 10, y: 10 }];
    let direction = { x: 0, y: 0 };
    let food = { x: 5, y: 5 };
    let bigFood = null;
    let bigFoodTimer = null;
    let score = 0;
    let gameInterval;
    let gameOver = false;

    function drawRect(x, y, color) {
      ctx.fillStyle = color;
      ctx.fillRect(x * gridSize, y * gridSize, gridSize, gridSize);
      ctx.strokeStyle = '#2c3e50';
      ctx.strokeRect(x * gridSize, y * gridSize, gridSize, gridSize);
    }

    function drawSnake() {
      snake.forEach((segment, index) => {
        if (index === 0) {
          // Draw snake head with eyes
          ctx.fillStyle = '#34eb95';
          ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize, gridSize);

          // Draw eyes based on direction
          ctx.fillStyle = 'white';
          if (direction.x === 1) {
            // Moving right
            ctx.fillRect(segment.x * gridSize + 14, segment.y * gridSize + 4, 4, 4);
            ctx.fillRect(segment.x * gridSize + 14, segment.y * gridSize + 12, 4, 4);
          } else if (direction.x === -1) {
            // Moving left
            ctx.fillRect(segment.x * gridSize + 2, segment.y * gridSize + 4, 4, 4);
            ctx.fillRect(segment.x * gridSize + 2, segment.y * gridSize + 12, 4, 4);
          } else if (direction.y === 1) {
            // Moving down
            ctx.fillRect(segment.x * gridSize + 4, segment.y * gridSize + 14, 4, 4);
            ctx.fillRect(segment.x * gridSize + 12, segment.y * gridSize + 14, 4, 4);
          } else if (direction.y === -1) {
            // Moving up
            ctx.fillRect(segment.x * gridSize + 4, segment.y * gridSize + 2, 4, 4);
            ctx.fillRect(segment.x * gridSize + 12, segment.y * gridSize + 2, 4, 4);
          } else {
            // Default eyes (looking right)
            ctx.fillRect(segment.x * gridSize + 14, segment.y * gridSize + 4, 4, 4);
            ctx.fillRect(segment.x * gridSize + 14, segment.y * gridSize + 12, 4, 4);
          }

          // Draw pupils
          ctx.fillStyle = 'black';
          if (direction.x === 1) {
            ctx.fillRect(segment.x * gridSize + 14, segment.y * gridSize + 5, 2, 2);
            ctx.fillRect(segment.x * gridSize + 14, segment.y * gridSize + 13, 2, 2);
          } else if (direction.x === -1) {
            ctx.fillRect(segment.x * gridSize + 2, segment.y * gridSize + 5, 2, 2);
            ctx.fillRect(segment.x * gridSize + 2, segment.y * gridSize + 13, 2, 2);
          } else if (direction.y === 1) {
            ctx.fillRect(segment.x * gridSize + 5, segment.y * gridSize + 14, 2, 2);
            ctx.fillRect(segment.x * gridSize + 13, segment.y * gridSize + 14, 2, 2);
          } else if (direction.y === -1) {
            ctx.fillRect(segment.x * gridSize + 5, segment.y * gridSize + 2, 2, 2);
            ctx.fillRect(segment.x * gridSize + 13, segment.y * gridSize + 2, 2, 2);
          } else {
            ctx.fillRect(segment.x * gridSize + 14, segment.y * gridSize + 5, 2, 2);
            ctx.fillRect(segment.x * gridSize + 14, segment.y * gridSize + 13, 2, 2);
          }
        } else {
          drawRect(segment.x, segment.y, '#34eb95');
        }
      });
    }

    function drawFood() {
      ctx.font = `${gridSize}px Arial`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#eb4034';
      ctx.fillText('🍎', food.x * gridSize + gridSize / 2, food.y * gridSize + gridSize / 2);
    }

    function drawBigFood() {
      if (!bigFood) return;
      ctx.font = `${gridSize * 2}px Arial`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = 'gold';
      ctx.fillText('🍏', bigFood.x * gridSize + gridSize / 2, bigFood.y * gridSize + gridSize / 2);
    }

    function moveSnake() {
      const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

      if (
        head.x < 0 || head.x >= tileCount ||
        head.y < 0 || head.y >= tileCount ||
        snake.some((segment, index) => index !== 0 && segment.x === head.x && segment.y === head.y)
      ) {
        return endGame();
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score++;
        scoreDisplay.textContent = `Score: ${score}`;
        placeFood();

        if (score % 5 === 0) {
          spawnBigFood();
        }
      } else if (bigFood && head.x === bigFood.x && head.y === bigFood.y) {
        score += 5; // Bigger apple gives 5 times the score
        scoreDisplay.textContent = `Score: ${score}`;
        clearBigFood();
      } else {
        snake.pop();
      }
    }

    function placeFood() {
      food.x = Math.floor(Math.random() * tileCount);
      food.y = Math.floor(Math.random() * tileCount);

      if (snake.some(segment => segment.x === food.x && segment.y === food.y)) {
        placeFood();
      }
    }

    function spawnBigFood() {
      bigFood = { x: Math.floor(Math.random() * tileCount), y: Math.floor(Math.random() * tileCount) };

      if (snake.some(segment => segment.x === bigFood.x && segment.y === bigFood.y) || 
          (food.x === bigFood.x && food.y === bigFood.y)) {
        spawnBigFood();
        return;
      }

      bigFoodTimer = setTimeout(() => {
        clearBigFood();
      }, 5000);
    }

    function clearBigFood() {
      bigFood = null;
      clearTimeout(bigFoodTimer);
    }

    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function updateGame() {
      if (gameOver) return;
      clearCanvas();
      drawFood();
      if (bigFood) drawBigFood();
      moveSnake();
      drawSnake();
    }

    function startGame() {
      gameOver = false;
      snake = [{ x: 10, y: 10 }];
      direction = { x: 0, y: 0 };
      score = 0;
      scoreDisplay.textContent = `Score: ${score}`;
      food = { x: 5, y: 5 };
      bigFood = null;
      clearBigFood();
      gameOverDisplay.style.display = 'none';
      clearInterval(gameInterval);
      gameInterval = setInterval(updateGame, 100);
    }

    function endGame() {
      gameOver = true;
      clearInterval(gameInterval);
      gameOverDisplay.style.display = 'block';
    }

    window.addEventListener('keydown', event => {
      if (event.key === 'ArrowUp' && direction.y === 0) direction = { x: 0, y: -1 };
      if (event.key === 'ArrowDown' && direction.y === 0) direction = { x: 0, y: 1 };
      if (event.key === 'ArrowLeft' && direction.x === 0) direction = { x: -1, y: 0 };
      if (event.key === 'ArrowRight' && direction.x === 0) direction = { x: 1, y: 0 };
      if (event.key === 'Enter' && gameOver) startGame();
    });

    startGame();
  </script>
</body>
</html>
