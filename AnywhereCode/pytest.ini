[pytest]
# Root of the package lives next to this file, so `import anyplace` works
# without installing anything (no `pip install -e .` required).
pythonpath = .

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -q
    -ra
    --strict-markers
    --strict-config
    --tb=short
    --showlocals

markers =
    slow: test is noticeably slow; deselect with `-m "not slow"`
    integration: touches a real external tool (git, npm, ...) rather than a stub

filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::ResourceWarning
    ignore::ImportWarning
